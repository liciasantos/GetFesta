<svg width="1600" height="700" viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E14F30"/>
      <stop offset="55%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#FF9270"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD98A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD98A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F2933" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1F2933" stop-opacity="0"/>
    </radialGradient>
    <path id="balloon" d="M50,4 C76,4 96,26 96,54 C96,80 78,100 58,108 C55,109.5 45,109.5 42,108 C22,100 4,80 4,54 C4,26 24,4 50,4 Z"/>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>
  <circle cx="1250" cy="140" r="260" fill="url(#glowGold)"/>
  <circle cx="180" cy="560" r="220" fill="url(#glowDark)"/>

  <!-- confetti -->
  <g fill="#FFB800">
    <circle cx="120" cy="120" r="6"/>
    <circle cx="260" cy="210" r="4"/>
    <circle cx="1420" cy="480" r="7"/>
    <circle cx="1500" cy="150" r="5"/>
    <circle cx="980" cy="90" r="4"/>
    <circle cx="720" cy="600" r="5"/>
  </g>
  <g fill="#FFFFFF" opacity="0.85">
    <rect x="340" y="90" width="10" height="10" rx="2" transform="rotate(18 345 95)"/>
    <rect x="1180" y="560" width="10" height="10" rx="2" transform="rotate(-12 1185 565)"/>
    <rect x="60" y="380" width="9" height="9" rx="2" transform="rotate(30 65 385)"/>
    <rect x="1350" y="300" width="9" height="9" rx="2" transform="rotate(-20 1355 305)"/>
  </g>
  <g fill="#1F2933" opacity="0.55">
    <circle cx="500" cy="70" r="4"/>
    <circle cx="1080" cy="220" r="4"/>
    <circle cx="200" cy="260" r="4"/>
  </g>

  <!-- balloon cluster, bottom right -->
  <g opacity="0.95">
    <g transform="translate(1230,300) rotate(-8) scale(2.15)">
      <path d="M50,120 C34,142 66,152 50,176" fill="none" stroke="#FFE9E1" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
      <use href="#balloon" fill="#FFFFFF" opacity="0.92"/>
    </g>
    <g transform="translate(1340,240) rotate(6) scale(1.55)">
      <path d="M50,120 C64,140 38,150 50,172" fill="none" stroke="#FFE9E1" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
      <use href="#balloon" fill="#FFB800" opacity="0.9"/>
    </g>
    <g transform="translate(1120,220) rotate(-4) scale(1.3)">
      <path d="M50,120 C38,138 60,146 50,168" fill="none" stroke="#FFE9E1" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
      <use href="#balloon" fill="#1F2933" opacity="0.35"/>
    </g>
  </g>

  <g opacity="0.5">
    <g transform="translate(120,120) rotate(10) scale(1.1)">
      <use href="#balloon" fill="#FFFFFF"/>
    </g>
    <g transform="translate(60,220) rotate(-6) scale(0.75)">
      <use href="#balloon" fill="#FFB800"/>
    </g>
  </g>
</svg>
