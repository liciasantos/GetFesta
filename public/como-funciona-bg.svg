<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2933" />
      <stop offset="42%" stop-color="#3a2a28" />
      <stop offset="72%" stop-color="#8f3a22" />
      <stop offset="100%" stop-color="#e2722b" />
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#ffd466" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffb800" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#ff6b4a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ff6b4a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4d6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fff4d6" stop-opacity="0" />
    </radialGradient>
    <filter id="blurSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="blurLg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
  </defs>

  <rect width="1600" height="700" fill="url(#sky)" />
  <ellipse cx="800" cy="760" rx="900" ry="420" fill="url(#sun)" />

  <!-- estrelas/bokeh distantes -->
  <g fill="#fff4d6">
    <circle cx="120" cy="90" r="2" opacity="0.5" />
    <circle cx="260" cy="140" r="1.6" opacity="0.4" />
    <circle cx="420" cy="70" r="2.2" opacity="0.5" />
    <circle cx="610" cy="120" r="1.4" opacity="0.35" />
    <circle cx="900" cy="60" r="2" opacity="0.45" />
    <circle cx="1120" cy="110" r="1.8" opacity="0.4" />
    <circle cx="1310" cy="80" r="2.2" opacity="0.5" />
    <circle cx="1480" cy="150" r="1.6" opacity="0.4" />
    <circle cx="1550" cy="60" r="2" opacity="0.4" />
  </g>

  <!-- varal de luzes (bokeh quente) atravessando o ceu -->
  <path d="M-40 220 C 300 120, 700 260, 1000 170 S 1500 260, 1660 190" stroke="#ffb800" stroke-opacity="0.18" stroke-width="2" fill="none" />
  <g filter="url(#blurSm)">
    <circle cx="60" cy="205" r="7" fill="#ffd466" opacity="0.85" />
    <circle cx="230" cy="165" r="6" fill="#ff8f66" opacity="0.75" />
    <circle cx="400" cy="200" r="8" fill="#ffb800" opacity="0.8" />
    <circle cx="580" cy="235" r="6" fill="#ffd466" opacity="0.7" />
    <circle cx="760" cy="190" r="7" fill="#ff8f66" opacity="0.8" />
    <circle cx="950" cy="180" r="6" fill="#ffb800" opacity="0.75" />
    <circle cx="1140" cy="215" r="8" fill="#ffd466" opacity="0.8" />
    <circle cx="1330" cy="195" r="6" fill="#ff8f66" opacity="0.7" />
    <circle cx="1500" cy="225" r="7" fill="#ffb800" opacity="0.78" />
  </g>

  <!-- balao flutuando, silhueta suave -->
  <g opacity="0.5" filter="url(#blurSm)">
    <circle cx="1330" cy="290" r="46" fill="#ff6b4a" />
    <path d="M1330 336 Q1322 380 1330 430" stroke="#ff6b4a" stroke-width="2" fill="none" opacity="0.6" />
  </g>
  <g opacity="0.35" filter="url(#blurSm)">
    <circle cx="230" cy="330" r="34" fill="#ffb800" />
    <path d="M230 364 Q224 400 230 440" stroke="#ffb800" stroke-width="2" fill="none" opacity="0.5" />
  </g>

  <!-- arco de baloes no horizonte, silhueta -->
  <g fill="#1a130f">
    <circle cx="800" cy="560" r="230" />
    <circle cx="650" cy="600" r="140" />
    <circle cx="950" cy="600" r="140" />
    <circle cx="540" cy="640" r="110" />
    <circle cx="1060" cy="640" r="110" />
    <circle cx="440" cy="670" r="90" />
    <circle cx="1160" cy="670" r="90" />
  </g>
  <g fill="#241a14">
    <circle cx="760" cy="470" r="30" />
    <circle cx="830" cy="450" r="24" />
    <circle cx="700" cy="500" r="20" />
    <circle cx="900" cy="490" r="26" />
  </g>

  <!-- brilho suave por tras do arco -->
  <ellipse cx="800" cy="560" rx="340" ry="160" fill="url(#glowSoft)" opacity="0.35" filter="url(#blurLg)" />

  <rect width="1600" height="700" fill="#1f2933" opacity="0.06" />
</svg>
