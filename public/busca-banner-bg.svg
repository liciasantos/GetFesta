<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14304d" />
      <stop offset="45%" stop-color="#2166d6" />
      <stop offset="100%" stop-color="#0a1c30" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6fa8ff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6fa8ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2933" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1f2933" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)" />
  <circle cx="180" cy="80" r="220" fill="url(#glow1)" filter="url(#blur)" />
  <circle cx="1420" cy="340" r="260" fill="url(#glow2)" filter="url(#blur)" />
  <circle cx="820" cy="420" r="200" fill="url(#glow1)" filter="url(#blur)" opacity="0.6" />

  <g fill="#ffffff" opacity="0.12">
    <circle cx="120" cy="320" r="4" />
    <circle cx="260" cy="260" r="3" />
    <circle cx="400" cy="330" r="5" />
    <circle cx="560" cy="270" r="3" />
    <circle cx="720" cy="310" r="4" />
    <circle cx="900" cy="250" r="3" />
    <circle cx="1060" cy="300" r="5" />
    <circle cx="1220" cy="260" r="3" />
    <circle cx="1380" cy="310" r="4" />
    <circle cx="1520" cy="250" r="3" />
  </g>

  <rect width="1600" height="400" fill="#1f2933" opacity="0.08" />
</svg>
